version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: diploma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: diploma_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - diploma_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d diploma_project']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  diploma_pg_data:
